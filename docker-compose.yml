version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: git.flare.gr:5050/venue-timer/venue-timer:latest
    ports:
      - "127.0.0.1:8989:80"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
